[workspace]
resolver = "3"
members = [
    "crates/rhythm_core",
    "crates/rhythm_engine",
    "crates/rhythm_app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06"] }
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "wgsl", "dx12"] }
egui = { version = "=0.36.2", default-features = false, features = ["default_fonts"] }
egui-winit = { version = "=0.36.2", default-features = false, features = ["clipboard"] }
egui-wgpu = { version = "=0.36.2", default-features = false, features = ["winit"] }
pollster = "1.0"
cpal = { version = "=0.18.2", default-features = false }
symphonia = { version = "=0.6.1", default-features = false, features = ["aac", "flac", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav"] }
rubato = { version = "=5.0.0", default-features = false, features = ["fft_resampler"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rfd = "=0.17.2"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
cosmic-text = "=0.19.0"

[workspace.lints.rust]
unsafe_code = "forbid"
