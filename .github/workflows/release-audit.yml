name: Release dependency audit

on:
  push:
    branches:
      - ai-340-dependency-advisory-review
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rustsec:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit Cargo.lock against RustSec
        run: cargo audit
